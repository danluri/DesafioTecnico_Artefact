services:
  emporio:
    build: .
    environment:
      EMPORIO_ENV: development
      EMPORIO_PRINCIPAL_HMAC_SECRET: development-only-change-me
      EMPORIO_DB_PATH: /data/emporio.db
      EMPORIO_LLM_PROVIDER: fake
      EMPORIO_MARKET_ENABLED: "false"
      EMPORIO_MCP_ENABLED: "false"
      EMPORIO_WHATSAPP_ENABLED: "false"
      EMPORIO_CORREIOS_ENABLED: "false"
      # Development console is disabled unless both this flag and --dev-console are used.
      # EMPORIO_DEV_CONSOLE_ENABLED: "true"
      # EMPORIO_DEV_CONSOLE_PORT: "8080"
      # Optional local semantic policy retrieval; lexical retrieval remains the default.
      # EMPORIO_POLICY_SEMANTIC_ENABLED: "true"
      # EMPORIO_POLICY_EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # EMPORIO_POLICY_EMBEDDING_MODEL: embeddinggemma
      # EMPORIO_POLICY_EMBEDDING_TIMEOUT: "10"
      # EMPORIO_POLICY_VECTOR_INDEX: /data/policy-index.json
      # EMPORIO_POLICY_SOURCE: /policies/políticas_da_loja.pdf
      # Optional WhatsApp primary remote channel; leave unset for offline P0.
      # EMPORIO_WHATSAPP_VERIFY_TOKEN: set-out-of-band
      # EMPORIO_WHATSAPP_ACCESS_TOKEN: set-out-of-band
      # EMPORIO_WHATSAPP_PHONE_NUMBER_ID: set-out-of-band
      # EMPORIO_WHATSAPP_APP_SECRET: set-out-of-band
      # EMPORIO_WHATSAPP_IDEMPOTENCY_DB: /data/whatsapp-events.db
      # EMPORIO_WHATSAPP_API_BASE_URL: https://graph.facebook.com
      # Optional Correios Rastro; use the official deployment base URL.
      # EMPORIO_CORREIOS_ENABLED: "true"
      # EMPORIO_CORREIOS_BASE_URL: https://apihom.correios.com.br
      # EMPORIO_CORREIOS_HOMOLOG_HOST: apihom.correios.com.br
      # EMPORIO_CORREIOS_PRODUCTION_HOST: api.correios.com.br
      # EMPORIO_CORREIOS_TOKEN: set-out-of-band
      # EMPORIO_CORREIOS_TIMEOUT: "5"
      # Optional local Llama example; uncomment and set the model to enable it.
      # EMPORIO_LLAMA_BASE_URL: http://host.docker.internal:11434
      # EMPORIO_LLAMA_MODEL: llama3.2
      # EMPORIO_LLAMA_TIMEOUT: "10"
    volumes:
      - emporio-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "emporio.runtime", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  emporio-data:

