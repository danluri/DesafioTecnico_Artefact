services:
  emporio:
    build: .
    environment:
      EMPORIO_ENV: development
      EMPORIO_PRINCIPAL_HMAC_SECRET: development-only-change-me
      EMPORIO_DB_PATH: /data/emporio.db
      EMPORIO_LLM_PROVIDER: fake
      # Optional local Llama example; uncomment and set the model to enable it.
      # EMPORIO_LLAMA_BASE_URL: http://host.docker.internal:11434
      # EMPORIO_LLAMA_MODEL: llama3.2
      # EMPORIO_LLAMA_TIMEOUT: "10"
    volumes:
      - emporio-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "emporio.runtime", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  emporio-data:

