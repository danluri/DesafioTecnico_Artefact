[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-assistant"
version = "0.1.0"
description = "Trusted policy and store-information assistant for the Artefact challenge"
requires-python = ">=3.13"
dependencies = [
  "pypdf>=5,<7",
]

[project.scripts]
emporio-policy = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
